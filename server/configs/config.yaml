# ============================================================
#  这是「模板」，不是生产配置。
#  打包脚本会把它复制成发布包里的 config.yaml.example，
#  部署时在服务器上复制一份改名为 configs/config.yaml 再改。
#  改这里 = 改所有新部署的默认值；已在跑的服务不受影响。
# ============================================================
server:
  # 注意：8080 常被 Steam 的 CEF 远程调试端口占用，故改用 8081
  port: 8081
  # 后台管理页面的独立端口（同一进程双端口：前台+API / 后台+API）
  admin_port: 8088
  mode: debug

  # ---- HTTPS（生产部署可选）----
  # 前提：已备案的域名 + 证书文件。三者齐备后自动启用，
  #   前台 443 走 HTTPS，port（80）自动 301 跳转到 HTTPS；缺任一项则以纯 HTTP 运行。
  # 腾讯云免费证书：控制台 → SSL 证书 → 申请免费证书 → 下载「Nginx」格式，
  #   得到 xxx_bundle.crt 和 xxx.key 两个文件，放到服务器某个目录（如 C:\chibarie\certs\）
  #   例如：https_port: 443 / cert_file: ./certs/fullchain.pem / key_file: ./certs/key.pem
  https_port: 0
  cert_file: ""
  key_file: ""

# 静态文件目录（相对服务工作目录）。
# 生产部署时后端自己直接提供页面，不依赖 Nginx；
# 若前面架了 Nginx/CDN，也可以把这两个目录交给它们托管
static:
  web: web
  admin: admin

database:
  # driver 可选 sqlite 或 mysql
  # 开发阶段默认 sqlite，零配置即可跑起来
  driver: sqlite
  sqlite:
    path: ./data/blog.db
  mysql:
    host: 127.0.0.1
    port: 3306
    user: root
    password: ""
    database: blog_chibarie
    charset: utf8mb4

jwt:
  secret: "blog-chibarie-please-change-this-secret"
  expire_hours: 168

upload:
  dir: ./uploads
  max_size_mb: 10
  url_prefix: /uploads

site:
  name: "chibarie"
  description: "记录技术与生活"
  keywords: "Go,Vue,博客,技术笔记"
  icp: ""
